<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0D0F15"><title>Meus anúncios — Elora</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/refinement.css"></head>
<body><header><a href="index.html" class="logo">elora<span class="logo-mark" aria-hidden="true"></span></a><nav id="nav-menu" aria-label="Navegação principal"></nav></header><main class="container account-page"><div class="page-intro"><div><p class="catalog-eyebrow">Área do vendedor</p><h1>Meus produtos</h1><p>Gerencie disponibilidade, estoque e detalhes dos seus anúncios.</p></div><a href="vender.html" class="btn">Anunciar produto <span aria-hidden="true">→</span></a></div><div id="product-summary" class="seller-summary" aria-live="polite"></div><div class="my-listing-toolbar"><label class="filter-search" for="mine-search">Buscar anúncio<input id="mine-search" type="search" placeholder="Nome ou categoria"></label><label class="filter-control" for="mine-status">Status<select id="mine-status"><option value="ALL">Todos</option><option value="ATIVO">Ativos</option><option value="PAUSADO">Pausados</option></select></label></div><div id="msg" class="alert" role="status"></div><div id="product-list" class="grid seller-product-grid"><p class="empty-state">Carregando seus produtos…</p></div></main>
<dialog id="delete-product-dialog" class="elora-dialog"><form method="dialog"><button class="dialog-close" aria-label="Fechar">×</button><h2>Remover anúncio?</h2><p id="delete-product-copy">Esta ação remove o anúncio da sua lista.</p><div class="dialog-actions"><button class="btn btn-secondary" value="cancel">Manter anúncio</button><button id="confirm-delete-product" class="btn btn-danger" type="button">Remover anúncio</button></div></form></dialog>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/nav.js"></script><script src="js/cart.js"></script><script src="js/my-products.js"></script></body></html>
