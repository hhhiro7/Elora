<body><header><a href="index.html" class="logo">elora<span class="logo-mark" aria-hidden="true"></span></a><nav id="nav-menu" aria-label="Navegação principal"></nav></header><main class="container account-page project-detail-page"><a class="detail-back" href="projetos.html">← Projetos disponíveis</a><div id="project-detail-message" class="detail-message" role="status" aria-live="polite">Carregando projeto…</div><div id="project-detail-layout" class="project-detail-layout" hidden><article class="card project-detail-card"><div class="project-detail-topline"><span id="project-category" class="badge badge-status"></span><span id="project-status" class="badge badge-status"></span></div><h1 id="project-title"></h1><div id="project-meta" class="project-meta"></div><div class="project-description-block"><h2>Sobre o projeto</h2><p id="project-description"></p></div><div id="project-owner" class="project-owner"></div><section id="received-proposals-section" hidden><div class="project-proposals-heading"><div><h2>Propostas recebidas</h2><p>Escolha com quem você quer conversar.</p></div><span id="proposal-count" class="project-proposal-count"></span></div><div id="received-proposals" class="received-proposals-list"></div></section><div id="project-owner-actions" class="project-owner-actions" hidden></div></article><aside id="proposal-aside" class="card proposal-aside" hidden><p class="catalog-eyebrow">Sua próxima oportunidade</p><h2>Envie uma proposta</h2><p>Conte como você pode ajudar. Depois, converse com o cliente para alinhar os detalhes.</p><form id="proposal-form"><div class="form-group"><label for="proposal-amount">Sua proposta (R$)</label><input id="proposal-amount" type="number" min="0.01" step="0.01" required></div><div class="form-group"><label for="proposal-days">Prazo de entrega (dias)</label><input id="proposal-days" type="number" min="1" max="365" required></div><div class="form-group"><label for="proposal-message">Mensagem ao cliente</label><textarea id="proposal
