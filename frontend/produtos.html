<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0D0F15"><title>Comprar produtos — Elora</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/refinement.css"></head>
<body><header><a href="index.html" class="logo">elora<span class="logo-mark" aria-hidden="true"></span></a><nav id="nav-menu" aria-label="Navegação principal"></nav></header><main class="container products-catalog-page">
<div class="catalog-heading"><div><p class="catalog-eyebrow">Marketplace de produtos</p><h1>Encontre seu próximo achado.</h1><p>Explore itens anunciados por pessoas da comunidade.</p></div><a class="btn" href="vender.html">Anunciar produto <span aria-hidden="true">→</span></a></div>
<section class="filters-panel catalog-filter-grid" aria-label="Filtros de produtos"><div class="filter-search"><label for="product-search">Buscar</label><input id="product-search" type="search" placeholder="Nome, descrição ou categoria" autocomplete="off"></div><div class="filter-control"><label for="product-category">Categoria</label><select id="product-category"><option value="">Todas</option></select></div><div class="filter-control"><label for="product-condition">Condição</label><select id="product-condition"><option value="">Todas</option><option value="NOVO">Novo</option><option value="USADO">Usado</option></select></div><div class="filter-price"><label>Faixa de preço</label><div><input id="product-min-price" type="number" min="0" step="0.01" placeholder="Mínimo" aria-label="Preço mínimo"><span>–</span><input id="product-max-price" type="number" min="0" step="0.01" placeholder="Máximo" aria-label="Preço máximo"></div></div><div class="filter-control"><label for="product-location">Localização</label><input id="product-location" type="search" placeholder="Cidade ou região"></div><div class="filter-control"><label for="product-sort">Ordenar por</label><select id="product-sort"><option value="recent">Mais recentes</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option></select></div><label class="filter-checkbox"><input id="product-in-stock" type="checkbox"><span>Disponível agora</span></label><button id="clear-product-filters" class="btn btn-secondary filter-clear" type="button">Limpar filtros</button></section>
<div class="catalog-results-row"><p id="product-results" class="filter-results" aria-live="polite">Carregando…</p><span class="catalog-trust">Anúncios publicados pela comunidade Elora</span></div><div id="msg" class="alert" role="status" aria-live="polite"></div><div class="grid product-grid" id="product-list" aria-live="polite"><p class="empty-state">Carregando produtos…</p></div><button id="load-more-products" class="btn btn-secondary load-more-button" type="button" hidden>Carregar mais</button>
</main><aside id="product-compare-dock" class="compare-dock" hidden aria-live="polite"><span><strong id="compare-count">0</strong>/4 produtos para comparar</span><button class="btn btn-secondary" id="clear-comparison" type="button">Limpar</button><a class="btn" href="comparar.html">Comparar</a></aside><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/nav.js"></script><script src="js/cart.js"></script><script src="js/favorites.js"></script><script src="js/compare.js"></script><script src="js/products.js"></script></body></html>
