<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0D0F15"><title>Contratar serviços — Elora</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/refinement.css"></head>
<body><header><a href="index.html" class="logo">elora<span class="logo-mark" aria-hidden="true"></span></a><nav id="nav-menu" aria-label="Navegação principal"></nav></header><main class="container services-catalog-page">
<div class="catalog-heading"><div><p class="catalog-eyebrow">Talentos e serviços</p><h1>Encontre quem pode ajudar.</h1><p>Descubra profissionais da comunidade e combine seu próximo projeto.</p></div><a href="oferecer-servico.html" class="btn">Oferecer serviço <span aria-hidden="true">→</span></a></div>
<section class="filters-panel catalog-filter-grid service-filter-grid" aria-label="Filtros de serviços"><div class="filter-search"><label for="service-search">Buscar</label><input id="service-search" type="search" placeholder="Serviço, habilidade ou profissional" autocomplete="off"></div><div class="filter-control"><label for="service-category">Categoria</label><select id="service-category"><option value="">Todas as categorias</option></select></div><div class="filter-price"><label>Preço</label><div><input id="service-min-price" type="number" min="0" step="0.01" placeholder="Mínimo" aria-label="Preço mínimo"><span>–</span><input id="service-max-price" type="number" min="0" step="0.01" placeholder="Máximo" aria-label="Preço máximo"></div></div><div class="filter-control"><label for="service-location">Localização</label><input id="service-location" type="search" placeholder="Cidade ou região"></div><div class="filter-control"><label for="service-sort">Ordenar por</label><select id="service-sort"><option value="recent">Mais recentes</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option></select></div><button id="clear-service-filters" class="btn btn-secondary filter-clear" type="button">Limpar filtros</button></section>
<div class="catalog-results-row"><p id="service-results" class="filter-results" aria-live="polite">Carregando…</p><span class="catalog-trust">Converse com o prestador antes de contratar</span></div><div id="service-list" class="grid service-grid" aria-live="polite"><p class="empty-state">Carregando serviços…</p></div><button id="load-more-services" class="btn btn-secondary load-more-button" type="button" hidden>Carregar mais</button>
</main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/nav.js"></script><script src="js/cart.js"></script><script src="js/favorites.js"></script><script src="js/services.js"></script></body></html>
