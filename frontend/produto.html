<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0D0F15"><title>Detalhes do produto — Elora</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/refinement.css"></head>
<body class="product-detail-page"><header class="detail-header"><a href="index.html" class="logo">elora<span class="logo-mark" aria-hidden="true"></span></a><nav id="nav-menu" aria-label="Navegação principal"></nav></header>
