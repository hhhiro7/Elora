<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0D0F15"><title>Detalhes do serviço — Elora</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/refinement.css"></head>
<body><header><a href="index.html" class="logo">Elora</a><nav id="nav-menu" aria-label="Navegação principal"></nav></header><main class="container service-detail-main">
<a class="detail-back" href="servicos.html"><span aria-hidden="true">←</span> Voltar aos serviços</a><div id="service-detail-message" class="detail-message" role="status" aria-live="polite">Carregando serviço…</div><article id="service-detail" class="service-detail card" hidden><div class="service-detail-image"><img id="service-image" alt=""></div><div class="service-detail-copy"><span id="service-category" class="badge badge-status"></span><h1 id="service-title"></h1><p id="service-description"></p><div class="service-details-meta" id="service-meta"></div><div class="service-seller card"><div id="service-seller-avatar" class="profile-avatar">E</div><div><span class="muted-copy">PRESTADO POR</span><h2 id="service-seller-name"></h2><a id="service-seller-link" href="#">Ver perfil público</a></div></div><div class="service-actions"><button id="service-favorite" class="btn btn-secondary" type="button">Salvar nos favoritos</button><button id="service-message" class="btn btn-secondary" type="button">Enviar mensagem</button><button id="service-request" class="btn" type="button">Solicitar serviço</button></div></div></article>
<section class="profile-section"><h2>Sobre o serviço</h2><p id="service-long-description" class="service-long-description"></p></section><section class="profile-section"><h2>Avaliações do prestador</h2><div id="service-reviews" class="reviews-list"></div></section>
<dialog id="service-request-dialog" class="elora-dialog"><form id="service-request-form"><button class="dialog-close" type="button" aria-label="Fechar" data-dialog-close>×</button><h2>Conte o que você precisa</h2><p>O prestador receberá sua solicitação com o preço anunciado.</p><label for="service-request-description">Detalhes do trabalho</label><textarea id="service-request-description" rows="5" required maxlength="2000" placeholder="Explique o objetivo, prazo desejado e informações importantes."></textarea><div id="service-request-message" class="alert" role="status"></div><button class="btn" type="submit">Enviar solicitação</button></form></dialog>
<dialog id="service-message-dialog" class="elora-dialog"><form id="service-message-form"><button class="dialog-close" type="button" aria-label="Fechar" data-dialog-close>×</button><h2>Fale com o prestador</h2><label for="service-message-content">Mensagem</label><textarea id="service-message-content" rows="4" required maxlength="4000" placeholder="Escreva sua mensagem…"></textarea><div id="service-message-feedback" class="alert" role="status"></div><button class="btn" type="submit">Enviar mensagem</button></form></dialog>
</main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/nav.js"></script><script src="js/cart.js"></script><script src="js/favorites.js"></script><script src="js/service-detail.js"></script></body></html>
