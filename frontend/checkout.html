<body><header><a href="index.html" class="logo">elora<span class="logo-mark" aria-hidden="true"></span></a><nav id="nav-menu" aria-label="Navegação principal"></nav></header><main class="container account-page checkout-page"><a href="carrinho.html" class="detail-back">← Voltar à sacola</a><div class="page-intro"><div><p class="catalog-eyebrow">Etapa final</p><h1>Finalizar compra</h1><p>Revise o pedido. Nenhuma cobrança real será feita.</p></div></div><div id="checkout-message" class="alert" role="status" aria-live="polite"></div><div class="checkout-layout"><form id="checkout-form" class="card checkout-form"><h2>Entrega</h2><div class="form-group"><label for="delivery-address">Endereço de entrega</label><textarea id="delivery-address" required maxlength="1000" rows="3" placeholder="Rua, número, bairro, cidade e CEP"></textarea></div><h2>Pagamento simulado</h2><fieldset class="payment-options"><legend>Escolha uma forma</legend><label><input type="radio" name="payment" value="PIX" checked><span><strong>PIX</strong><small>Confirmação simulada</small></span></label><label><input type="radio" name="payment" value="CREDIT_CARD"><span><strong>Cartão</strong><small>Sem cobrança real</small></span></label></fieldset><button id="place-order" class="btn" type="submit">Confirmar pedido</button><p class="muted-copy">Este projeto não processa pagamentos reais.</p></form><aside class="card checkout-summary"><h2>Seu pedido</h2><div id="checkout-items"></div><div id="checkout-total" class="checkout-total"></div></aside></div></main>
