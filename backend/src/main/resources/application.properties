spring.application.name=Elora
server.port=8080

# Configuração local opcional; o arquivo backend/.env é ignorado pelo Git.
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL (principal). Configure estes valores por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/elora}
spring.datasource.username=${DB_USERNAME:elora}
spring.datasource.password=${DB_PASSWORD:elora_dev}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: configure um segredo forte por ambiente, nunca no código.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
elora.cors.allowed-origins=${ELORA_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:8080}
